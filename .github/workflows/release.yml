name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
            binary: gitgrapher
          - name: macos-aarch64
            os: macos-14
            archive: tar.gz
            binary: gitgrapher
          - name: windows-x86_64
            os: windows-latest
            archive: zip
            binary: gitgrapher.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --bin gitgrapher

      - name: Prepare archive
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          cp README.md LICENSE ROADMAP.md dist/

      - name: Create tar archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C dist .

      - name: Create zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitgrapher-${{ matrix.name }}
          path: gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
