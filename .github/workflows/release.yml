name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            binary: gitgrapher
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            ext: tar.gz
            binary: gitgrapher
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ext: tar.gz
            binary: gitgrapher
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            binary: gitgrapher.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --bin gitgrapher --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: '"target/${{ matrix.target }}/release/${{ matrix.binary }}" --version'

      - name: Prepare archive
        shell: bash
        run: |
          archive_dir="gitgrapher-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir -p "$archive_dir/docs"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$archive_dir/${{ matrix.binary }}"
          cp README.md LICENSE ROADMAP.md "$archive_dir/"
          cp docs/benchmark.md docs/releasing.md docs/scaling.md "$archive_dir/docs/"

      - name: Create tar archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: tar -czf "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}"

      - name: Create zip archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}/*" -DestinationPath "gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitgrapher-${{ matrix.name }}
          path: gitgrapher-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum gitgrapher-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
