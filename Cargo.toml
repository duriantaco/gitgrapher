[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/duriantaco/gitgrapher"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
anyhow = "1"

# Concurrency
rayon = "1"
dashmap = "6"

# Parsing
tree-sitter = "0.24"

# Search
tantivy = "0.22"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Serialization
bincode = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
tokio = { version = "1", features = ["full"] }

# File watching
notify = "7"

# NAPI
napi = { version = "2", features = ["async", "serde-json", "napi9"] }
napi-derive = "2"

# Internal crates
gg-core = { path = "crates/gg-core" }
gg-parse = { path = "crates/gg-parse" }
gg-resolve = { path = "crates/gg-resolve" }
gg-graph = { path = "crates/gg-graph" }
gg-search = { path = "crates/gg-search" }
gg-pipeline = { path = "crates/gg-pipeline" }
